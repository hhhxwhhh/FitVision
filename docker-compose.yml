name: fitvision

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: fitvision.settings
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?Copy .env.docker.example to .env and set SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DB_NAME: ${DB_NAME:-fitvision}
  DB_USER: ${DB_USER:-fitvision}
  DB_PASSWORD: ${DB_PASSWORD:?Copy .env.docker.example to .env and set DB_PASSWORD}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CACHE_BACKEND: redis
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  SECURE_SSL_REDIRECT: "False"
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  CN_VLM_API_KEY: ${CN_VLM_API_KEY:-}
  CN_VLM_MODEL: ${CN_VLM_MODEL:-doubao-1.5-vision-pro-250328}
  CN_VLM_BASE_URL: ${CN_VLM_BASE_URL:-https://openkey.cloud/v1}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fitvision}
      POSTGRES_USER: ${DB_USER:-fitvision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fitvision} -d ${DB_NAME:-fitvision}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "fitvision", "worker", "-l", "info"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
