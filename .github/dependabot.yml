version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Major ML upgrades need manual testing.
      - dependency-name: torch
        update-types: ["version-update:semver-major"]
      - dependency-name: chromadb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
