frontend:
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Makefile"
          - "docker-compose.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package-lock.json"
          - "**/requirements*.txt"
